name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        include:
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "backend[dev]"
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # Workers do not commit frontend/dist, so on a pull request the build is only handed over for review.
      - name: Upload the built UI
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
      # On main the committed bundle must be what the sources build to. A push that changes the UI sources
      # is rebuilt and committed by the "Rebuild bundled UI" workflow (ui-dist.yml), so it only gets a note.
      - name: Check that the committed frontend/dist matches the sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git add -N frontend/dist
          if git diff --quiet -- frontend/dist; then
            echo "frontend/dist matches a build of the sources."
            exit 0
          fi
          git diff --stat -- frontend/dist
          inputs="frontend/src frontend/index.html frontend/package.json frontend/package-lock.json frontend/vite.config.ts frontend/tsconfig.json frontend/scripts"
          [ -n "$BEFORE" ] && git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null || true
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && [ -n "$(git diff --name-only "$BEFORE" HEAD -- $inputs)" ]; then
            echo "::notice::This push changed the UI sources; the Rebuild bundled UI workflow commits the new frontend/dist."
            exit 0
          fi
          echo "::error::The committed frontend/dist does not match a build of frontend/src. Run 'npm ci && npm run build' in frontend/ and commit frontend/dist, or run the 'Rebuild bundled UI' workflow from the Actions tab."
          exit 1

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: python -m pip install -e backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # The test run starts its own server (synthetic feed, private port, temporary data directory).
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: "true"
          E2E_PYTHON: python
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  windows-run-bat:
    name: windows (run.bat starts the server)
    runs-on: windows-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start run.bat, wait for the API and the UI, then stop it
        shell: pwsh
        env:
          PAPERDESK_NO_BROWSER: "1"
          PAPERDESK_NO_PAUSE: "1"
          PAPERDESK_DATA: ${{ runner.temp }}\paperdesk-data
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'run-bat.log'
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'run.bat' -RedirectStandardOutput $log `
               -RedirectStandardError "$log.err" -PassThru -NoNewWindow
          $ok = $false
          try {
            for ($i = 0; $i -lt 180; $i++) {
              if ($p.HasExited) { break }
              try {
                $s = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/api/status' -TimeoutSec 3
                if ($s.paper -eq $true) { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ok) { throw 'The API did not answer on http://127.0.0.1:8000/api/status' }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/' -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<div id="root">') { throw 'GET / did not return the UI' }
            Write-Host 'run.bat started the server; API and UI both answered.'
          } finally {
            Write-Host '--- run.bat output ---'
            Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
            taskkill /PID $p.Id /T /F | Out-Null
          }

  docker:
    name: docker (build the image and smoke-test it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the image
        run: docker build -t paperdesk:ci .
      - name: Check the compose file
        run: docker compose config --quiet
      # Responses are captured before grep looks at them: with pipefail, "curl | grep -q" can fail when grep
      # exits early and curl gets SIGPIPE.
      - name: Run the container, wait for the API and the UI, then stop it
        run: |
          docker run -d --name paperdesk-ci -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true paperdesk:ci
          ok=""
          for i in $(seq 1 60); do
            status="$(curl -fsS http://127.0.0.1:8000/api/status 2>/dev/null || true)"
            case "$status" in *'"paper":true'*) ok=1; break ;; esac
            sleep 2
          done
          docker logs paperdesk-ci
          test -n "$ok" || { echo "The API did not answer on http://127.0.0.1:8000/api/status"; exit 1; }
          page="$(curl -fsS http://127.0.0.1:8000/)"
          case "$page" in *'<div id="root">'*) ;; *) echo "GET / did not return the UI"; exit 1 ;; esac
          # GET, not HEAD: the UI route answers GET only.
          headers="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8000/)"
          grep -qi '^content-security-policy:' <<<"$headers" || { echo "No security headers on /"; echo "$headers"; exit 1; }
          echo "The image starts; API and UI both answered."
      - name: LAN mode without a passcode refuses to start
        run: |
          if docker run --rm -e PAPERDESK_LAN=1 paperdesk:ci > lan.log 2>&1; then
            cat lan.log; echo "The container started in LAN mode without a passcode"; exit 1
          fi
          cat lan.log
          grep -q "needs a passcode" lan.log
      - name: LAN mode with a passcode asks for it
        run: |
          docker run -d --name paperdesk-lan -p 127.0.0.1:8001:8000 -e PAPERDESK_LAN=1 -e PAPERDESK_LOOPBACK_BYPASS=0 \
            -e PAPERDESK_PASSCODE='ci only test passcode 7' paperdesk:ci
          ok=""
          for i in $(seq 1 60); do
            state="$(curl -fsS http://127.0.0.1:8001/api/auth/state 2>/dev/null || true)"
            case "$state" in *'"auth_required":true'*) ok=1; break ;; esac
            sleep 2
          done
          docker logs paperdesk-lan
          test -n "$ok" || { echo "The LAN mode container did not answer"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/accounts)"
          test "$code" = 401 || { echo "Expected 401 without signing in, got $code"; exit 1; }
          echo "LAN mode container refuses the API without a session."
      - name: Stop the containers
        if: always()
        run: docker rm -f paperdesk-ci paperdesk-lan || true
