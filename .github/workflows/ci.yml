name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        include:
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "backend[dev]"
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # One job per browser engine (WebKit, the slowest, in two shards), so the e2e stage stays well under
  # 15 minutes. No retries: a flaky test is fixed, not retried. Traces and screenshots are uploaded only when
  # something fails. Visual baselines live in e2e/tests/__screenshots__/linux (see e2e/README.md).
  e2e:
    name: e2e (${{ matrix.engine }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, shard: 1, shards: 1 }
          - { engine: firefox, shard: 1, shards: 1 }
          - { engine: webkit, shard: 1, shards: 2 }
          - { engine: webkit, shard: 2, shards: 2 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: python -m pip install -e backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps ${{ matrix.engine }}
        working-directory: e2e
      # The test run starts its own servers (synthetic feed, private ports, temporary data directories).
      # With the label update-visual-baselines on the pull request, baselines that differ are rewritten
      # (--update-snapshots=changed) instead of failing; missing ones are always written. Either way the
      # next step prints the new files so they can be committed (see e2e/README.md).
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ matrix.shards }} ${{ contains(github.event.pull_request.labels.*.name, 'update-visual-baselines') && '--update-snapshots=changed' || '' }}
        working-directory: e2e
        env:
          CI: "true"
          E2E_PYTHON: python
          E2E_ENGINES: ${{ matrix.engine }}
      - name: Print new or changed visual baselines
        if: always()
        working-directory: e2e
        run: |
          files="$(git status --porcelain --untracked-files=all -- tests/__screenshots__ | cut -c4-)"
          if [ -z "$files" ]; then echo "No new or changed visual baselines."; exit 0; fi
          echo "$files"
          echo "Decode with: tools/baselines_from_log.py <log file> (from the repository root)."
          echo "----- BEGIN PAPERDESK BASELINES -----"
          (cd .. && printf '%s\n' $files | tar czf - -T -) | base64 -w 120
          echo "----- END PAPERDESK BASELINES -----"
      - name: Upload traces, screenshots and new visual baselines
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/tests/__screenshots__/
          retention-days: 7

  # The desktop suite in Microsoft Edge on Windows, against a server started by run.bat (so paths, line
  # endings and a non-UTC time zone are exercised end to end).
  e2e-windows:
    name: e2e (windows, Edge, run.bat)
    needs: [backend, frontend]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Use a time zone that is not UTC
        run: tzutil /s "Pacific Standard Time"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      # One step: a process started with Start-Process does not outlive the step that started it.
      - name: Start run.bat, then run the desktop and sign-in suites in Edge against it
        shell: pwsh
        working-directory: e2e
        env:
          PAPERDESK_NO_BROWSER: "1"
          PAPERDESK_NO_PAUSE: "1"
          PAPERDESK_DATA: ${{ runner.temp }}\paperdesk-e2e-data
          PORT: "8000"
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_ENGINES: chromium
          E2E_CHANNEL: msedge
          E2E_PYTHON: ${{ github.workspace }}\backend\.venv\Scripts\python.exe
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'run-bat-e2e.log'
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', '..\run.bat' -RedirectStandardOutput $log `
               -RedirectStandardError "$log.err" -PassThru -NoNewWindow
          $ok = $false
          try {
            for ($i = 0; $i -lt 180; $i++) {
              if ($p.HasExited) { break }
              try { $s = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/api/status' -TimeoutSec 3; if ($s.paper -eq $true) { $ok = $true; break } } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ok) { throw 'run.bat did not start the server on http://127.0.0.1:8000' }
            Write-Host "Time zone: $((Get-TimeZone).Id)"
            npx playwright test --project=desktop --project=auth-desktop
            if ($LASTEXITCODE -ne 0) { throw "Playwright failed with exit code $LASTEXITCODE" }
          } finally {
            Write-Host '--- run.bat output (last 100 lines) ---'
            Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Select-Object -Last 100
            taskkill /PID $p.Id /T /F | Out-Null
          }
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-windows-edge
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  windows-run-bat:
    name: windows (run.bat starts the server)
    runs-on: windows-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start run.bat, wait for the API and the UI, then stop it
        shell: pwsh
        env:
          PAPERDESK_NO_BROWSER: "1"
          PAPERDESK_NO_PAUSE: "1"
          PAPERDESK_DATA: ${{ runner.temp }}\paperdesk-data
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'run-bat.log'
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'run.bat' -RedirectStandardOutput $log `
               -RedirectStandardError "$log.err" -PassThru -NoNewWindow
          $ok = $false
          try {
            for ($i = 0; $i -lt 180; $i++) {
              if ($p.HasExited) { break }
              try {
                $s = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/api/status' -TimeoutSec 3
                if ($s.paper -eq $true) { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ok) { throw 'The API did not answer on http://127.0.0.1:8000/api/status' }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/' -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<div id="root">') { throw 'GET / did not return the UI' }
            Write-Host 'run.bat started the server; API and UI both answered.'
          } finally {
            Write-Host '--- run.bat output ---'
            Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
            taskkill /PID $p.Id /T /F | Out-Null
          }

  docker:
    name: docker (build the image and smoke-test it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build the image
        run: docker build -t paperdesk:ci .
      - name: Check the compose file
        run: docker compose config --quiet
      # Responses are captured before grep looks at them: with pipefail, "curl | grep -q" can fail when grep
      # exits early and curl gets SIGPIPE.
      - name: Run the container, wait for the API and the UI, then stop it
        run: |
          docker run -d --name paperdesk-ci -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true paperdesk:ci
          ok=""
          for i in $(seq 1 60); do
            status="$(curl -fsS http://127.0.0.1:8000/api/status 2>/dev/null || true)"
            case "$status" in *'"paper":true'*) ok=1; break ;; esac
            sleep 2
          done
          docker logs paperdesk-ci
          test -n "$ok" || { echo "The API did not answer on http://127.0.0.1:8000/api/status"; exit 1; }
          page="$(curl -fsS http://127.0.0.1:8000/)"
          case "$page" in *'<div id="root">'*) ;; *) echo "GET / did not return the UI"; exit 1 ;; esac
          # GET, not HEAD: the UI route answers GET only.
          headers="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8000/)"
          grep -qi '^content-security-policy:' <<<"$headers" || { echo "No security headers on /"; echo "$headers"; exit 1; }
          echo "The image starts; API and UI both answered."
      - name: LAN mode without a passcode refuses to start
        run: |
          if docker run --rm -e PAPERDESK_LAN=1 paperdesk:ci > lan.log 2>&1; then
            cat lan.log; echo "The container started in LAN mode without a passcode"; exit 1
          fi
          cat lan.log
          grep -q "needs a passcode" lan.log
      - name: LAN mode with a passcode asks for it
        run: |
          docker run -d --name paperdesk-lan -p 127.0.0.1:8001:8000 -e PAPERDESK_LAN=1 -e PAPERDESK_LOOPBACK_BYPASS=0 \
            -e PAPERDESK_PASSCODE='ci only test passcode 7' paperdesk:ci
          ok=""
          for i in $(seq 1 60); do
            state="$(curl -fsS http://127.0.0.1:8001/api/auth/state 2>/dev/null || true)"
            case "$state" in *'"auth_required":true'*) ok=1; break ;; esac
            sleep 2
          done
          docker logs paperdesk-lan
          test -n "$ok" || { echo "The LAN mode container did not answer"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/accounts)"
          test "$code" = 401 || { echo "Expected 401 without signing in, got $code"; exit 1; }
          echo "LAN mode container refuses the API without a session."
      - name: Stop the containers
        if: always()
        run: docker rm -f paperdesk-ci paperdesk-lan || true
