name: Rebuild bundled UI

# Keeps the committed frontend/dist (served by run.sh and run.bat, which need no Node) in step with
# frontend/src: after every push to main it rebuilds the UI and commits the result if it changed.
# Loop guard: a push that only touches frontend/dist does not start this workflow (paths-ignore), the
# commit is made with the default GITHUB_TOKEN (whose pushes start no workflows) and the job skips
# commits made by the bot.
on:
  push:
    branches: [main]
    paths-ignore:
      - "frontend/dist/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-dist
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Commit frontend/dist if it changed
        run: |
          git add -A frontend/dist
          if git diff --cached --quiet -- frontend/dist; then
            echo "frontend/dist is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild the bundled UI (frontend/dist) from ${GITHUB_SHA::12}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push refused (main moved on); rebasing and retrying."
            git pull --rebase origin main
          done
          echo "::error::Could not push the rebuilt frontend/dist to main after three attempts."
          exit 1
